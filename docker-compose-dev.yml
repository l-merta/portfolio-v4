services:
  portfolio:
    container_name: portfolio-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/app # Mount local files into the container for live reloading
      - /app/node_modules # Keep the container's own node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
